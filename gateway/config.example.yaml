# Copy to config.yaml — this file stays on the client machine and is never
# sent to the cloud platform. Credentials referenced here never leave this
# machine except as a live database connection.
platform_url: "https://your-platform.example.com/api/v1"

# How often the gateway sends a heartbeat and re-runs connection tests.
heartbeat_interval_seconds: 300

# Column profiling: once a day the Gateway samples a few hundred rows per
# table and sends the platform a small SUMMARY of each column (how many are
# empty, how many distinct values, whether it holds dates/numbers/text) so
# mapping can check a column holds the right kind of data, not just the right
# name. Real values are sent ONLY for small columns whose NAME marks them as a
# category (status, type, level...) and whose few values repeat, e.g. a status of
# active/locked. Never for people, identifiers, free text, amounts, or anything
# named like a password, email, salary, etc. Set false to turn it off entirely,
# or add `profiling: false` to a single connection below.
profiling_enabled: true
profile_interval_hours: 24
profile_sample_rows: 500

# Relationship measurement: the platform asks which columns of your tables might
# refer to each other (e.g. api_access.user_id -> users.user_id) and the Gateway counts,
# on YOUR database, how many distinct values of one column also exist in the other.
# Only those COUNTS are sent back - never a value, a row or a column's contents. Set
# false to turn it off entirely, or add `relationships: false` to a single connection.
relationships_enabled: true

connections:
  - connection_id: "PASTE-THE-CONNECTION-ID-FROM-THE-DATA-SOURCES-UI"
    type: postgresql # postgresql | mysql | sql_server | mongodb | oracle | sap_hana | snowflake
    host: "192.168.1.10"
    port: 5432
    database: "FinanceDB"
    username: "audit_readonly"
    # Prefer an environment variable over a plaintext password here:
    password_env: "FINANCE_DB_PASSWORD"
    # password: "only-if-you-must — password_env is strongly preferred"
    schema: null # optional; defaults to the database's default schema
    # profiling: false # uncomment to keep this connection out of column profiling
    # relationships: false # uncomment to keep this connection out of relationship measurement

  # MongoDB example — self-hosted, on a private network with no public
  # address at all. This is exactly the case a direct connection can never
  # reach; the Gateway can, because it runs INSIDE that same network and
  # only ever calls OUT to the platform (no inbound firewall rule, no IP
  # to allowlist on the MongoDB side).
  - connection_id: "PASTE-THE-CONNECTION-ID-FROM-THE-DATA-SOURCES-UI"
    type: mongodb
    host: "10.0.4.22" # or a mongodb+srv hostname if mongodb_srv: true below
    port: 27017 # ignored when mongodb_srv is true, but still required here
    database: "hr_records"
    username: "audit_readonly"
    password_env: "MONGO_DB_PASSWORD"
    mongodb_srv: false # true for a mongodb+srv:// connection (e.g. most managed MongoDB hosts, including Atlas)

  # Oracle (python-oracledb, "thin" mode: no Oracle Client install needed on this machine).
  # `database` is the SERVICE NAME (e.g. ORCLPDB1). For an older database that is addressed by a SID, use
  # oracle_connection_type: sid and put the SID in `database`.
  - connection_id: "PASTE-THE-CONNECTION-ID-FROM-THE-DATA-SOURCES-UI"
    type: oracle
    host: "10.0.5.30"
    port: 1521
    database: "ORCLPDB1"
    # oracle_connection_type: service_name # service_name (default) | sid
    username: "audit_readonly"
    password_env: "ORACLE_DB_PASSWORD"
    schema: "FINANCE" # optional; defaults to the user's own schema

  # SAP HANA. A tenant-database connection needs only host and port (no `database`). TLS is on and the server
  # certificate is validated unless you set sap_hana_encrypt: false.
  - connection_id: "PASTE-THE-CONNECTION-ID-FROM-THE-DATA-SOURCES-UI"
    type: sap_hana
    host: "10.0.5.40"
    port: 30015
    username: "AUDIT_READONLY"
    password_env: "HANA_DB_PASSWORD"
    # sap_hana_encrypt: true
    schema: "SAPHANADB" # optional

  # Snowflake. `host` is your ACCOUNT IDENTIFIER (e.g. xy12345.eu-west-1), not a URL. database, schema and
  # snowflake_warehouse are required. Use a role that can only read what the audit needs.
  - connection_id: "PASTE-THE-CONNECTION-ID-FROM-THE-DATA-SOURCES-UI"
    type: snowflake
    host: "xy12345.eu-west-1"
    database: "FINANCE"
    schema: "PUBLIC"
    snowflake_warehouse: "AUDIT_WH"
    snowflake_role: "AUDIT_READER" # optional
    username: "AUDIT_READONLY"
    password_env: "SNOWFLAKE_PASSWORD"
    # Key-pair sign-in instead of a password: the PEM private key is read from a file or an environment
    # variable (never written into this file), plus its passphrase if it has one.
    # snowflake_auth_method: key_pair
    # private_key_file: "C:/secrets/snowflake_rsa_key.p8"   # or: private_key_env: "SNOWFLAKE_PRIVATE_KEY"
    # private_key_passphrase_env: "SNOWFLAKE_KEY_PASSPHRASE"
