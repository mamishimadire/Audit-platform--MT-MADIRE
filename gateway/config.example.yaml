# Copy to config.yaml — this file stays on the client machine and is never
# sent to the cloud platform. Credentials referenced here never leave this
# machine except as a live database connection.
platform_url: "https://your-platform.example.com/api/v1"

# How often the gateway sends a heartbeat and re-runs connection tests.
heartbeat_interval_seconds: 300

# Column profiling: once a day the Gateway samples a few hundred rows per
# table and sends the platform a small SUMMARY of each column (how many are
# empty, how many distinct values, whether it holds dates/numbers/text) so
# mapping can check a column holds the right kind of data, not just the right
# name. Real values are sent ONLY for small, non-sensitive, enum-like columns
# such as a status (never for anything named like a password, email, salary,
# etc., and never for identifiers, dates or free text). Set false to turn it
# off entirely, or add `profiling: false` to a single connection below.
profiling_enabled: true
profile_interval_hours: 24
profile_sample_rows: 500

connections:
  - connection_id: "PASTE-THE-CONNECTION-ID-FROM-THE-DATA-SOURCES-UI"
    type: postgresql # postgresql | mysql | sql_server | mongodb
    host: "192.168.1.10"
    port: 5432
    database: "FinanceDB"
    username: "audit_readonly"
    # Prefer an environment variable over a plaintext password here:
    password_env: "FINANCE_DB_PASSWORD"
    # password: "only-if-you-must — password_env is strongly preferred"
    schema: null # optional; defaults to the database's default schema
    # profiling: false # uncomment to keep this connection out of column profiling

  # MongoDB example — self-hosted, on a private network with no public
  # address at all. This is exactly the case a direct connection can never
  # reach; the Gateway can, because it runs INSIDE that same network and
  # only ever calls OUT to the platform (no inbound firewall rule, no IP
  # to allowlist on the MongoDB side).
  - connection_id: "PASTE-THE-CONNECTION-ID-FROM-THE-DATA-SOURCES-UI"
    type: mongodb
    host: "10.0.4.22" # or a mongodb+srv hostname if mongodb_srv: true below
    port: 27017 # ignored when mongodb_srv is true, but still required here
    database: "hr_records"
    username: "audit_readonly"
    password_env: "MONGO_DB_PASSWORD"
    mongodb_srv: false # true for a mongodb+srv:// connection (e.g. most managed MongoDB hosts, including Atlas)
